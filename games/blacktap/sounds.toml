# Sound bank for Assassin's Keg: Black Tap. Every sound is synthesized (pav_audio::bank).
# A cue is layers; a layer is a source (sine square saw triangle noise pink brown dust pluck
# voice) -> optional formant (ah eh ee oh oo uh mm) -> filter (lp bp hp notch) -> drive ->
# envelope (attack decay sustain hold release; decay/release are times to about -48 dB).
# freq_end/glide sweep pitch, cutoff_end sweeps the filter, pitch_curve = [[s, semitones]...],
# lfo = [{ to = pitch|amp|cutoff|pan|fm, rate, depth, shape = sine|triangle|square|saw|random|hold }].
# Per play: pitch_rand (semitones), gain_rand (dB), delay_rand (s), spread (pan); repeat and
# repeat_gap play a layer several times; variant = n picks one variant per play.
# Cue fields: range (m to -6 dB), bus (sfx music ambience voice ui), positional, reverb, echo,
# rumble = { low, high, ms } (controller), stinger (music.toml), cooldown (s).

