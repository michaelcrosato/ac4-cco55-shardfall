# Phase 1 walking-skeleton level: a blocky cay with a Brotherhood flag. The real Tab I world
# (islands, town, fort) replaces it in Phase 2. Room-file format: rooms/_template.toml.
name = "Skeleton Cay"
about = "A sand cay with a flag: the walking skeleton's one objective."
entrance = { at = [4, 10], facing = "east" }

[layout]
origin = [-12.0, 0.0, -8.0]

[[layout.layer]]
y = 0
map = '''
........................
.....ssssssssssss.......
...ssssssssssssssss.....
..sssssggggggggsssss....
..ssssgggggggggggssss...
.sssssggggggggggggsss...
.sPsssgggggggggggFsss...
.sssssggggggggggggsss...
..ssssgggggggggggssss...
..sssssggggggggsssss....
...ssssssssssssssss.....
.....ssssssssssss.......
........................
'''

[layout.legend.'.']

[layout.legend.'s']
blocks = [{ y0 = -1.0, y1 = 0.0, color = "#e8d3a2" }]

[layout.legend.'g']
blocks = [{ y0 = -1.0, y1 = 0.25, color = "#6aa84f" }]

[layout.legend.'P']
blocks = [{ y0 = -1.0, y1 = 0.0, color = "#e8d3a2" }]
marker = "player"

[layout.legend.'F']
blocks = [{ y0 = -1.0, y1 = 0.25, color = "#6aa84f" }]
marker = "flag"
