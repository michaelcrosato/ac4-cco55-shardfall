# Music for Assassin's Keg: Black Tap. Songs are ABC files in shanties/ (by file name); each
# [song.*] arranges one for the band (pav_audio::instruments: accordion squeeze fiddle cello
# tremolo whistle guitar bass stomp bodhran clap choir solo horn drone pulse tick bell timpani
# snare shout hum). Parts:
#   role    melody harmony choir bass chords arp drums drone
#   stem    plays when the game's intensity >= stem (it fades in over +-0.1); stem_max caps it
#   pattern one bar, evenly divided: bass R/F/O/T, chords x X u(up-strum) _ (hold), arp 1-9,
#           drums X x o(ghost) . (rest). Default patterns follow the meter (oom-pah, jig, waltz).
#   sections / bars / passes   limit a part to section roles, bar ranges or passes
# Choir parts sing the melody: the solo shantyman on "call" sections, the crew on "response",
# and the crew with an octave below and a fifth on "chorus". Bars count through the repeats;
# a pickup bar is bar 0. States are playlists (looping); MusicCue.song names a state or a song.

crossfade = 2.0

