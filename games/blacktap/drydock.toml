# The Drydock (developer and training level, PLAN §9.19): the rules' data, in tab1.toml's format
# (markers, routes, people, perches, posters), plus the stations (`[[station]]`, read by
# crates/blacktap/src/drydock.rs). Its geometry is drydock_world.toml.
# Coordinates: x east, z south, metres; sea level y = 0; the station ground is at y = 2.
geometry = "drydock_world.toml"

# Wanted posters on the poster wall's fence (tear them down to lower the heat).
poster = [[25.5, 2.0, -15.6], [28.5, 2.0, -15.6], [31.5, 2.0, -15.6], [34.5, 2.0, -15.6]]

[bounds]
soft = 400.0
hard = 440.0

# The cay and the rocks for the map (the generated terrain is in drydock_world.toml).
[[shape]]
name = "The Drydock"
center = [0.0, 0.0]
radii = [76.0, 55.0]
height = 2.0
shelf = 10.0

[[shape]]
name = "Mortar Rock"
center = [118.0, 28.0]
radii = [9.0, 9.0]
height = 3.5
shelf = 6.0

[[shape]]
name = "Gun Rock"
center = [-190.0, 140.0]
radii = [8.0, 8.0]
height = 3.0
shelf = 6.0

# ---------------------------------------------------------------- markers
[marker]
# The Black Tap, moored west of the pier with her bow to the lagoon mouth; the player's start.
r1_start = [-6.8, 0.0, 24.0]
start = [0.5, 2.1, 6.0]
# Flotsam crates down the sailing lane (the game places six at flotsam_1..6).
flotsam_1 = [-7.0, 0.0, 110.0]
flotsam_2 = [7.0, 0.0, 135.0]
flotsam_3 = [-7.0, 0.0, 190.0]
flotsam_4 = [7.0, 0.0, 215.0]
flotsam_5 = [-7.0, 0.0, 240.0]
flotsam_6 = [7.0, 0.0, 280.0]
# Gunnery range: three dummy hulls and a dummy battery on Gun Rock.
gun_target_1 = [-140.0, 0.0, 165.0]
gun_target_2 = [-165.0, 0.0, 200.0]
gun_target_3 = [-125.0, 0.0, 225.0]
gun_battery = [-190.0, 4.5, 140.0]
# The boarding hulk's mooring and where the duel schooner comes from.
hulk = [-72.0, 0.0, 90.0]
duel_spawn = [220.0, 0.0, 260.0]
# The stealth yard's whistle spot (in the grass beside the post guard).
whistle = [-55.0, 2.0, -23.5]
# The combat ring's middle (ropes round it) and the map table on the quay.
ring_center = [-52.0, 2.0, 6.0]
map_table = [14.5, 2.0, -6.0]

# Markers taken from the generated structures (drydock_world.toml).
[marker_from]
tower_perch = "hay_tower.perch"
tower_landing = "tower_cart.landing"
climb_perch = "climb_house_c.roof"
climb_landing = "climb_cart.landing"
wall_top = "climb_wall.walk"
run_roof = "run_a.roof"
mortar_pos = "mortar_tower.mortar"
docks = "pier.end"

# ---------------------------------------------------------------- routes (x/z)
[route]
yard_loop = [[-60.0, -42.0], [-49.0, -42.0], [-49.0, -28.5], [-64.0, -28.5], [-64.0, -38.0]]
# The sailing lane's gates (a red and a green buoy 16 m either side of each point).
sailing_lane = [[0.0, 90.0], [0.0, 140.0], [0.0, 190.0], [0.0, 240.0], [0.0, 290.0]]

# ---------------------------------------------------------------- perches
[[perch]]
name = "haystack_tower"
marker = "tower_perch"
leap_to = "tower_landing"
reveals = 150.0

[[perch]]
name = "climbing_roof"
marker = "climb_perch"
leap_to = "climb_landing"
reveals = 120.0

# ---------------------------------------------------------------- people (groups spawned by drydock.rs)
# ring and range: practice dummies (blind until the ring's Spar pad); yard: real guards; market:
# a gossip crowd.
[[npc]]
group = "ring"
kind = "guard"
at = [-52.0, 2.0, 1.0]
facing = 180.0
tags = ["dummy"]

[[npc]]
group = "ring"
kind = "brute"
at = [-47.0, 2.0, 6.0]
facing = 270.0
tags = ["dummy"]

[[npc]]
group = "ring"
kind = "musketeer"
at = [-52.0, 2.0, 11.0]
facing = 0.0
tags = ["dummy"]

[[npc]]
group = "ring"
kind = "officer"
at = [-57.0, 2.0, 6.0]
facing = 90.0
tags = ["dummy"]

[[npc]]
group = "range"
kind = "guard"
at = [-58.0, 2.0, 37.0]
facing = 0.0
tags = ["dummy"]

[[npc]]
group = "range"
kind = "guard"
at = [-52.0, 2.0, 38.0]
facing = 0.0
tags = ["dummy"]

[[npc]]
group = "range"
kind = "brute"
at = [-46.0, 2.0, 37.0]
facing = 0.0
tags = ["dummy"]

[[npc]]
group = "yard"
kind = "guard"
at = [-60.0, 2.0, -42.0]
route = "yard_loop"

[[npc]]
group = "yard"
kind = "guard"
at = [-62.0, 2.0, -22.0]
facing = 90.0

[[npc]]
group = "market"
kind = "civilian"
at = [-36.0, 2.0, -8.0]
tags = ["gossip"]
count = 3

[[npc]]
group = "market"
kind = "civilian"
at = [-28.0, 2.0, -7.0]
tags = ["gossip"]
count = 3

[[npc]]
group = "market"
kind = "civilian"
at = [-33.0, 2.0, -14.5]
count = 2

# ---------------------------------------------------------------- stations
# key, name, kind (sea | traversal | combat | presentation), at = the sign (y 0: on the
# ground), facing = the way the sign reads (degrees from north: 180 = read from the south),
# afloat = a sea station (its sign stands in the water and its pads are rings the ship sails
# through), radius = where its guide shows, learn = the guide's line. Pads: at, effect (see
# drydock.rs, `trigger`), label.

[[station]]
key = "pier"
name = "Pier"
kind = "sea"
at = [-6.0, 0.0, -11.0]
facing = 180.0
radius = 10.0
learn = "Jump off to swim; climb the ladders. Hold Interact at the wheel to take the helm."
pads = [
  { at = [-1.1, 2.0, 21.0], effect = "ship:board", label = "Step aboard" },
  { at = [1.0, 2.0, 15.0], effect = "ship:refit", label = "Refit" },
  { at = [1.0, 2.0, 10.0], effect = "ship:home", label = "Bring her home" },
]

[[station]]
key = "map_table"
name = "Map Table"
kind = "presentation"
at = [11.0, 0.0, -11.0]
facing = 180.0
radius = 5.0
learn = "The map: the cay, the rocks and the sea stations."
pads = [{ at = [11.0, 2.0, -6.5], effect = "map:open", label = "Open the map" }]

[[station]]
key = "sailing_lane"
name = "Sailing Lane"
kind = "sea"
afloat = true
at = [26.0, 0.0, 82.0]
facing = 330.0
radius = 110.0
learn = "Stick sets sails and steers. Sail through a ring to swing the wind 90 degrees."
pads = [
  { at = [0.0, 0.0, 165.0], effect = "wind:veer", label = "Wind veers 90" },
  { at = [0.0, 0.0, 258.0], effect = "wind:back", label = "Wind backs 90" },
  { at = [34.0, 0.0, 118.0], effect = "flotsam:fresh", label = "Fresh flotsam" },
]

[[station]]
key = "gunnery_range"
name = "Gunnery Range"
kind = "sea"
afloat = true
at = [-95.0, 0.0, 140.0]
facing = 20.0
radius = 90.0
learn = "Look to a side and Fire: broadsides, chain shot ahead, kegs astern. Aim shows arcs."
pads = [{ at = [-82.0, 0.0, 162.0], effect = "gunnery:reset", label = "Fresh targets" }]

[[station]]
key = "duel_buoy"
name = "Duel Buoy"
kind = "sea"
afloat = true
at = [112.0, 0.0, 148.0]
facing = 300.0
radius = 80.0
learn = "Sail through the ring to call a schooner. Brace when her gunports glow."
pads = [{ at = [110.0, 0.0, 172.0], effect = "duel:spawn", label = "Call a duel" }]

[[station]]
key = "mortar_yard"
name = "Mortar Yard"
kind = "sea"
afloat = true
at = [95.0, 0.0, 58.0]
facing = 270.0
radius = 60.0
learn = "The ring arms the mortar on the rock. Steer out of the red rings."
pads = [{ at = [82.0, 0.0, 80.0], effect = "mortar:toggle", label = "Mortar on/off" }]

[[station]]
key = "boarding_hulk"
name = "Boarding Hulk"
kind = "sea"
afloat = true
at = [-46.0, 0.0, 70.0]
facing = 20.0
radius = 50.0
learn = "Come alongside slowly, within 30 m, and Jump to board. Win the deck fight."
pads = [{ at = [-36.0, 0.0, 98.0], effect = "hulk:fresh", label = "Fresh hulk" }]

[[station]]
key = "climbing_wall"
name = "Climbing Wall"
kind = "traversal"
at = [4.0, 0.0, -20.0]
facing = 180.0
radius = 9.0
learn = "Hold Free-run into a wall to climb. Poles, beam, line, balconies; leap into the hay."
pads = [
  { at = [0.0, 0.0, -17.0], effect = "lift:wall_top", label = "Lift: wall top" },
  { at = [4.0, 0.0, -17.0], effect = "lift:climb_perch", label = "Lift: roof" },
  { at = [8.0, 0.0, -17.0], effect = "slowmo:toggle", label = "Slow motion" },
]

[[station]]
key = "haystack_tower"
name = "Haystack Tower"
