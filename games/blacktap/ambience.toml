# Ambience layers for Assassin's Keg: Black Tap (pav_audio::ambience). The game sets a level
# (0..1) per layer every frame in AudioState.ambience; layers not named fade out.
#   bed    held layers (sounds.toml layer fields; give them sustain = 1), faded by the level
#   event  random one-shots: cue = a sounds.toml cue (or inline layers), every = [min, max] s
#          (shorter at higher levels), min_level, gain, spread (pan), pitch_rand, gain_rand
#   fade   seconds to follow the level; curve: gain = level^curve
#   level_cutoff / level_pitch   octaves the beds' filter / pitch move from level 0 to 1

[layer.sea]
about = "open water: a deep swell and a breaking wash"
fade = 2.0
[[layer.sea.bed]]
wave = "brown"
filter = "lp"
cutoff = 520
attack = 2.0
sustain = 1.0
release = 2.0
stereo = true
gain = 0.9
lfo = [{ to = "amp", rate = 0.11, depth = 0.7 }, { to = "cutoff", rate = 0.11, depth = 0.5 }]
[[layer.sea.bed]]
wave = "pink"
filter = "bp"
cutoff = 900
q = 0.8
attack = 2.0
sustain = 1.0
release = 2.0
stereo = true
gain = 0.35
lfo = [{ to = "amp", rate = 0.17, depth = 0.8, shape = "random" }, { to = "cutoff", rate = 0.11, depth = 0.7 }]

[layer.wind]
about = "band-passed noise in gusts; louder and higher with wind speed"
