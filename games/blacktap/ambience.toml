filter = "bp"
cutoff = 650
q = 2.2
attack = 1.5
sustain = 1.0
release = 1.5
stereo = true
gain = 1.3
lfo = [{ to = "cutoff", rate = 0.3, depth = 0.8, shape = "random" }, { to = "amp", rate = 0.25, depth = 0.6, shape = "random" }]
[[layer.wind.bed]]
wave = "noise"
filter = "bp"
cutoff = 1700
q = 9
attack = 1.5
sustain = 1.0
release = 1.5
gain = 0.35
pan = 0.3
lfo = [{ to = "cutoff", rate = 0.2, depth = 0.6, shape = "random" }, { to = "amp", rate = 0.3, depth = 0.8, shape = "random" }]

