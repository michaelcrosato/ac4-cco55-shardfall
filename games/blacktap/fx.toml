# What each cue looks like (pav_view::cue_fx). Particles use the engine's presets (smoke, steam,
# sparks, embers, fountain, dust, bubbles, confetti, fire...) with multipliers; shock = a
# shockwave radius (m); water = a dent in the sea surface (m); flash = a short point light.
# No blood anywhere: sparks, dust and splinters instead.

[cue.cannon_fire]
particles = [{ preset = "smoke", count = 36, spread = 2.5, size = 2.2, life = 2.2, up = 1.2, area = 1.2, color = "#d9d4ca" },
             { preset = "sparks", count = 18, spread = 1.6, color = "#ffc46a" }]
flash = { color = "#ffb060", intensity = 6.0, radius = 16.0, seconds = 0.12 }
shock = 4.0

