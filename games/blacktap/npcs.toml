# Archetypes (PLAN.md §9.9–9.11, §9.17): how each looks (puppet), fights
# (pav_kit::combat::CombatProfile) and sees (pav_kit::perception::Senses). Colours sRGB hex.
# Look fields (all optional; crates/blacktap/src/looks.rs):
#   skin shirt pants shoes            body colours
#   helm helm_color                   none cap helm great crown horned halo hood tricorne bicorne
#                                     bandana straw_hat beaked_hood
#   trim                              edging: hat brims, a bicorne's cockade, a straw hat's band,
#                                     a beaked hood's face, a coat's front edges and cuffs
#   hair                              hair or a wig round the hat, with a queue down the back
#   coat coat_color                   coat skirts (0 none, 1 to the knees; colour "" = shirt)
#   stripes                           bands round the shirt
#   belt belt_strap                   the buckle and the strap round the waist
#   gloves bracer holsters            gloves; the Tap bracer's leather (left forearm); pistols
#                                     holstered at the belt (0..4)
#   pauldrons armor_color cape cape_color
#   weapon weapon_color weapon_grip   none sword cutlass axe mace dagger spear staff greatsword
#                                     maul wand claw pistol musket; blade/barrel and wood colours
#   scale bulk                        size; build (thicker torso, wider shoulders: brutes)
# `variants` (crowds): partial looks laid over `look`; looks::look_variant(kind, index) picks one.

