# The world-generation yard (`pav capture scene=yard`): one ~200 m island with a colonial
# street and plaza, a fort corner on the north-east cliffs, docks in the south bay, jungle,
# stalk grass, and one of every structure kind. Format: `island.rs` (islands, sea, markers),
# `structures.rs` ([[structure]]), `vegetation.rs` ([vegetation]).

[markers]
spawn = [-22.0, 0.0, 28.0]
overview = [0.0, 0.0, 0.0]

[sea]
color = "#2f8fa6"

[[island]]
name = "yard"
seed = 11
outline = [[-102, 0], [-88, -44], [-52, -70], [0, -76], [48, -80], [88, -66], [104, -32],
           [98, 8], [74, 44], [36, 64], [-4, 70], [-46, 64], [-84, 40]]
beach = 11
shelf = 24
rise = 5
peaks = [{ at = [-34, -26], height = 21, radius = 58 }, { at = [16, -34], height = 11, radius = 40 }]
cliffs = [{ from = [44, -80], to = [104, -28], height = 15 }]
noise = { scale = 34, amp = 2.2, seed = 4 }
# The town plateau above the south bay and the fort plateau on the cliff top.
flatten = [
  { polygon = [[-64, 10], [12, 10], [14, 52], [-62, 52]], height = 3.0, blend = 8, ground = "dirt", color = "#c9ad83" },
  { polygon = [[44, -70], [92, -62], [96, -26], [46, -20]], height = 15.0, blend = 10, ground = "grass" },
]
roads = [{ points = [[12, 30], [24, 22], [32, 4], [42, -12], [56, -14]], width = 4 },
         { points = [[-70, 30], [-62, 30]], width = 3 }]
grass = [[[18, -8], [34, -10], [34, 6], [20, 8]],
         [[-12, -50], [6, -52], [8, -40], [-10, -38]],
         [[-80, -8], [-66, -12], [-64, 2], [-78, 4]]]

[vegetation]
seed = 5
grass = { spacing = 0.9, height = [1.0, 1.3], width = 1.05, color = "#a9b552", color2 = "#7c9a3e" }

# Beach palms: dense on the sand, leaning out to sea.
[[vegetation.rule]]
asset = "LIB/core/palm"
ground = ["sand", "grass"]
height = [0.7, 7.0]
slope = 18
spacing = 9
chance = 0.55
patchy = 0.2
scale = [0.8, 1.15]
seeds = 6
pole = { radius = 0.17, height = 7.0, lean = 2.2 }

# Jungle: trees, palms among them, bushes and ferns underneath.
[[vegetation.rule]]
asset = "LIB/core/jungle_tree"
ground = ["jungle"]
height = [3.0, 40.0]
slope = 30
spacing = 8
chance = 0.7
scale = [0.9, 1.3]
seeds = 4
pole = { radius = 0.3, height = 5.0, lean = 0.0 }

[[vegetation.rule]]
asset = "LIB/core/palm"
ground = ["jungle", "grass"]
height = [3.0, 30.0]
slope = 26
spacing = 13
chance = 0.45
scale = [0.9, 1.25]
seeds = 6
pole = { radius = 0.17, height = 7.0, lean = 2.2 }

[[vegetation.rule]]
asset = "LIB/core/bush"
ground = ["jungle"]
height = [1.5, 40.0]
slope = 32
spacing = 5
chance = 0.5
scale = [1.1, 1.9]
seeds = 4

[[vegetation.rule]]
asset = "LIB/core/bush"
ground = ["grass"]
height = [1.5, 40.0]
slope = 32
spacing = 9
chance = 0.35
patchy = 0.3
scale = [0.8, 1.3]
seeds = 4

[[vegetation.rule]]
asset = "LIB/core/fern"
ground = ["jungle", "grass"]
height = [2.0, 40.0]
slope = 34
spacing = 4.5
chance = 0.45
scale = [1.0, 1.6]
seeds = 3

# Undergrowth clumps (one grass-renderer instance each).
[[vegetation.rule]]
tuft = { height = [0.8, 1.2], width = 1.5, color = "#356f33", color2 = "#5a9444" }
ground = ["jungle"]
height = [2.0, 40.0]
slope = 36
spacing = 2.8
chance = 0.55

[[vegetation.rule]]
tuft = { height = [0.35, 0.6], width = 0.8, color = "#7fae55", color2 = "#a2b25a" }
ground = ["grass"]
height = [1.5, 40.0]
slope = 30
spacing = 5
chance = 0.35
patchy = 0.4

# Driftwood on the wet sand.
[[vegetation.rule]]
asset = "LIB/core/driftwood"
ground = ["wet_sand", "sand"]
height = [0.05, 1.0]
slope = 14
spacing = 14
chance = 0.45
scale = [0.8, 1.2]
seeds = 3
align = true

# Palms in the plaza and by the chapel.
[[vegetation.place]]
asset = "LIB/core/palm"
at = [-6.5, 22]
yaw = 30
seed = 2
pole = { radius = 0.17, height = 7.0, lean = 2.2 }

[[vegetation.place]]
asset = "LIB/core/palm"
at = [5.5, 41]
yaw = 200
seed = 4
pole = { radius = 0.17, height = 7.0, lean = 2.2 }

[[vegetation.place]]
asset = "LIB/core/palm"
at = [-8, 40.5]
yaw = 120
scale = 0.9
seed = 1
pole = { radius = 0.17, height = 7.0, lean = 2.2 }

